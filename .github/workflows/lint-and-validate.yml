name: Code Quality & Manifest Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  yamllint:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yamllint
        run: pip install --no-cache-dir yamllint

      - name: Run yamllint
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 180}, truthy: disable, document-start: disable}}" \
            ansible/ k8s/ docker/

  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "scripts"
          severity: "warning"

  kubeconform:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate K8s Manifests
        run: |
          kubeconform -kubernetes-version 1.31.0 -strict -summary \
            k8s/artifacts_pvc.yaml \
            k8s/amd_gpu_device_plugin.yaml \
            k8s/artifact_server.yaml \
            k8s/piper_tts_deployment.yaml \
            k8s/llama_server_dynamic.yaml \
            k8s/media_assembler_job.yaml \
            k8s/sd_diffusion_job_template.yaml

  python-tests:
    name: Python Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir ruff pytest fastapi uvicorn pydantic httpx

      - name: Run Ruff Linter
        run: |
          ruff check scripts/ docker/piper-tts/ tests/

      - name: Run Unit Tests
        run: |
          pytest tests/ -v
