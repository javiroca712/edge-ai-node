apiVersion: v1
kind: Namespace
metadata:
  name: ai-workloads
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-models-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /opt/ai-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: ai-workloads
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 50Gi
