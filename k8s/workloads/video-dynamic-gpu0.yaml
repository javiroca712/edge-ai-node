apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-engine-gpu0
  namespace: ai-workloads
  labels:
    app.kubernetes.io/name: video-engine
    modality: video-generation
spec:
  # Default to 0 replicas: scale-to-zero when idle, scale-to-1 on demand
  replicas: 0
  selector:
    matchLabels:
      app: video-engine
  template:
    metadata:
      labels:
        app: video-engine
        modality: video-generation
        accelerator: gpu0-pcie-x16
    spec:
      nodeSelector:
        node.kubernetes.io/role: worker
      containers:
      - name: comfyui-video
        image: custom-comfyui-rocm:latest
        imagePullPolicy: IfNotPresent
        command:
          - python3
          - main.py
          - --listen
          - "0.0.0.0"
          - --port
          - "8188"
          - --use-split-cross-attention
          - --preview-method
          - "none"
        env:
          - name: HSA_OVERRIDE_GFX_VERSION
            value: "10.3.0"
          - name: HIP_VISIBLE_DEVICES
            value: "0"
          - name: PYTORCH_HIP_ALLOC_CONF
            value: "garbage_collection_threshold:0.8,max_split_size_mb:128"
        securityContext:
          privileged: true
        resources:
          limits:
            memory: "2.5Gi"
          requests:
            memory: "1.2Gi"
        ports:
          - containerPort: 8188
            name: http-api
        volumeMounts:
          - name: models-storage
            mountPath: /models
            readOnly: true
      volumes:
        - name: models-storage
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: video-service
  namespace: ai-workloads
spec:
  type: ClusterIP
  ports:
    - port: 8188
      targetPort: 8188
      name: http-api
  selector:
    app: video-engine
