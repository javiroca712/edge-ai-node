---
- name: Install build tools and model downloader dependencies
  apt:
    name:
      - git
      - build-essential
      - cmake
      - wget
    state: present

- name: Create directories for models and llama.cpp
  file:
    path: "{{ item }}"
    state: directory
    owner: llama-api
    group: llama-api
    mode: '0755'
  loop:
    - /opt/ai-models
    - /opt/llama.cpp

- name: Clone llama.cpp repository
  git:
    repo: https://github.com/ggml-org/llama.cpp.git
    dest: /opt/llama.cpp
    version: master
    update: no

- name: Apply Flash Attention patch to bypass RDNA2 max_blocks_per_sm crash
  replace:
    path: /opt/llama.cpp/ggml/src/ggml-cuda/fattn-common.cuh
    regexp: 'GGML_ASSERT\(max_blocks_per_sm > 0\);'
    replace: 'if (max_blocks_per_sm <= 0) { max_blocks_per_sm = 1; }'

- name: Generate CMake build configuration for gfx1030
  command: cmake -B build -DGGML_HIP=ON -DAMDGPU_TARGETS=gfx1030
  args:
    chdir: /opt/llama.cpp
    creates: /opt/llama.cpp/build/CMakeCache.txt

- name: Compile llama.cpp native HIP binary
  command: cmake --build build --config Release -j {{ ansible_processor_vcpus | default('6') }}
  args:
    chdir: /opt/llama.cpp
    creates: /opt/llama.cpp/build/bin/llama-server

- name: Download Meta-Llama-3.1-8B-Instruct-Q4_K_M GGUF model
  get_url:
    url: https://huggingface.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/resolve/main/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    dest: /opt/ai-models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    owner: llama-api
    group: llama-api
    mode: '0644'
  args:
    creates: /opt/ai-models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf

- name: Ensure correct ownership on /opt/llama.cpp and /opt/ai-models
  file:
    path: "{{ item }}"
    owner: llama-api
    group: llama-api
    recurse: yes
  loop:
    - /opt/llama.cpp
    - /opt/ai-models
