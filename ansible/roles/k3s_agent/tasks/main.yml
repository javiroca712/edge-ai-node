---
- name: Verify network reachability to K3s Control Plane on Dev Laptop
  wait_for:
    host: "{{ k3s_server_host }}"
    port: "{{ k3s_server_port }}"
    timeout: 10
    msg: "Cannot connect to K3s Control Plane at {{ k3s_server_host }}:{{ k3s_server_port }}. Ensure the Docker container is running on the laptop."

- name: Audit host memory and swap state
  assert:
    that:
      - ansible_facts['memtotal_mb'] <= 4500
      - ansible_facts['swaptotal_mb'] >= 8000
    fail_msg: "Host does not match expected edge profile (4GB RAM, >=8GB Swap). Check hardware inventory."
    quiet: yes

- name: Check if k3s agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Deploy dynamic hardware discovery script
  copy:
    src: ../../../scripts/discover_node_hardware.sh
    dest: /usr/local/bin/discover_node_hardware.sh
    mode: "0755"
    owner: root
    group: root

- name: Execute dynamic hardware discovery to inspect PCIe and VRAM
  command: /usr/local/bin/discover_node_hardware.sh
  register: hardware_discovery_result
  changed_when: false

- name: Parse dynamically discovered node labels
  set_fact:
    discovered_labels_raw: "{{ hardware_discovery_result.stdout | regex_search('ANSIBLE_NODE_LABELS=\"(.*)\"', '\\1') | first }}"

- name: Convert discovered labels to structured list
  set_fact:
    discovered_labels_list: "{{ discovered_labels_raw.split(' ') }}"

- name: Ensure /etc/rancher/k3s configuration directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Deploy declarative K3s agent configuration with dynamic hardware labels
  template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
    owner: root
    group: root
  notify: restart k3s-agent

- name: Install k3s agent binary and systemd service
  shell: |
    curl -sfL https://get.k3s.io | sh -
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "agent"
  when: not k3s_binary.stat.exists or (k3s_upgrade | default(false))

- name: Ensure k3s-agent service is started and enabled
  systemd:
    name: k3s-agent.service
    state: started
    enabled: yes

- name: Verify k3s-agent systemd service status
  command: systemctl is-active k3s-agent.service
  register: k3s_service_status
  changed_when: false
  failed_when: k3s_service_status.stdout != "active"
