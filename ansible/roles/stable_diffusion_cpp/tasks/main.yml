---
- name: Ensure required build, multimedia, and ROCm libraries are installed
  apt:
    name:
      - build-essential
      - cmake
      - git
      - ffmpeg
      - aria2
      - libhipblas-dev
      - librocsolver-dev
      - librocblas-dev
      - libgomp1
    state: present
    update_cache: yes

- name: Check if sd-cli binary already exists
  stat:
    path: "{{ sd_cpp_dest }}/build/bin/sd-cli"
  register: sd_cli_bin

- name: Clone stable-diffusion.cpp repository
  git:
    repo: "{{ sd_cpp_repo }}"
    dest: "{{ sd_cpp_dest }}"
    recursive: yes
    version: master
    force: no
  when: not sd_cli_bin.stat.exists

- name: Patch RDNA2 Flash Attention bug in ggml submodule
  replace:
    path: "{{ sd_cpp_dest }}/ggml/src/ggml-cuda/fattn-common.cuh"
    regexp: '^\s*GGML_ASSERT\(max_blocks_per_sm > 0\);'
    replace: '    if (max_blocks_per_sm <= 0) { max_blocks_per_sm = 1; }'
  when: not sd_cli_bin.stat.exists

- name: Configure CMake build for stable-diffusion.cpp with HIPBLAS
  command: >
    cmake -B build
    -DSD_HIPBLAS=ON
    -DAMDGPU_TARGETS={{ sd_cpp_amdgpu_target }}
  args:
    chdir: "{{ sd_cpp_dest }}"
  when: not sd_cli_bin.stat.exists

- name: Compile sd-cli binary with Release optimization
  command: cmake --build build --config Release -j{{ ansible_processor_vcpus | default(4) }}
  args:
    chdir: "{{ sd_cpp_dest }}"
  when: not sd_cli_bin.stat.exists

- name: Verify compiled sd-cli binary exists and is executable
  file:
    path: "{{ sd_cpp_dest }}/build/bin/sd-cli"
    mode: "0755"
    state: file

- name: Ensure AnimateDiff models directory exists
  file:
    path: "{{ animatediff_dir }}"
    state: directory
    owner: ai-agent
    group: ai-agent
    mode: "0775"

- name: Check if base SD 1.5 model exists
  stat:
    path: "{{ animatediff_dir }}/{{ sd_base_model_filename }}"
  register: base_model_stat

- name: Download base SD 1.5 model (Realistic Vision V6.0 B1)
  get_url:
    url: "{{ sd_base_model_url }}"
    dest: "{{ animatediff_dir }}/{{ sd_base_model_filename }}"
    mode: "0664"
    owner: ai-agent
    group: ai-agent
    timeout: 600
  when: not base_model_stat.stat.exists

- name: Check if ToonYou Beta6 cartoon model exists
  stat:
    path: "{{ animatediff_dir }}/toonyou_beta6.safetensors"
  register: toonyou_stat

- name: Download ToonYou Beta6 cartoon model for stylized animation
  get_url:
    url: "https://huggingface.co/uwg/modelz_base/resolve/main/toonyou_beta6.safetensors"
    dest: "{{ animatediff_dir }}/toonyou_beta6.safetensors"
    mode: "0664"
    owner: ai-agent
    group: ai-agent
    timeout: 900
  when: not toonyou_stat.stat.exists

- name: Check if AnimateDiff motion module exists
  stat:
    path: "{{ animatediff_dir }}/{{ sd_motion_module_filename }}"
  register: motion_module_stat

- name: Download AnimateDiff v3 motion module
  get_url:
    url: "{{ sd_motion_module_url }}"
    dest: "{{ animatediff_dir }}/{{ sd_motion_module_filename }}"
    mode: "0664"
    owner: ai-agent
    group: ai-agent
    timeout: 300
  when: not motion_module_stat.stat.exists

- name: Ensure Piper TTS directory exists
  file:
    path: /opt/piper/voices
    state: directory
    owner: ai-agent
    group: ai-agent
    mode: "0755"

- name: Check if Piper binary exists
  stat:
    path: /opt/piper/piper/piper
  register: piper_bin

- name: Download and extract Piper TTS binary
  unarchive:
    src: "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz"
    dest: /opt/piper
    remote_src: yes
    owner: ai-agent
    group: ai-agent
  when: not piper_bin.stat.exists

- name: Download Piper cartoon voices (Bryce & Lessac)
  get_url:
    url: "{{ item.url }}"
    dest: "/opt/piper/voices/{{ item.filename }}"
    mode: "0644"
    owner: ai-agent
    group: ai-agent
  loop:
    - { url: "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/bryce/medium/en_US-bryce-medium.onnx", filename: "en_US-bryce-medium.onnx" }
    - { url: "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/bryce/medium/en_US-bryce-medium.onnx.json", filename: "en_US-bryce-medium.onnx.json" }
    - { url: "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx", filename: "en_US-lessac-medium.onnx" }
    - { url: "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json", filename: "en_US-lessac-medium.onnx.json" }

- name: Deploy dual-GPU 30s cartoon production script
  copy:
    src: ../../../scripts/produce_30s_cartoon.sh
    dest: /usr/local/bin/produce_30s_cartoon.sh
    mode: "0755"
    owner: root
    group: root
