---
- name: Deploy Lightweight K3s Agent on Edge Node (Option B)
  hosts: edge_nodes
  become: yes
  roles:
    - role: k3s_agent
      vars:
        k3s_server_host: "{{ lookup('env', 'LAPTOP_TAILSCALE_IP') | default(k3s_override_host | default('100.112.218.62'), true) }}"
        k3s_token: "{{ lookup('env', 'K3S_TOKEN') | default(k3s_override_token | default('edge-ai-node-secret-token-change-me'), true) }}"
